name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Needed by actions/attest-build-provenance to mint artifact attestations.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:icons && npm run build

      - name: Test
        run: npm test

      # Prove the release assets were built from this repository. The
      # attestations are linked to the assets by digest, so the release must
      # upload the same files (main.js, styles.css, manifest.json) unchanged.
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Obsidian downloads only these files; extra artifacts (e.g. a zip)
          # are ignored, so keep the release to exactly what the store needs.
          files: |
            main.js
            manifest.json
            styles.css
