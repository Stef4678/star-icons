name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:icons && npm run build

      - name: Test
        run: npm test

      - name: Package
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cp -r packs release/
          cd release && zip -r ../star-icons.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            packs/*.json
            star-icons.zip
